version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_DB: my_db
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: my_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  scrapper:
    build: ./scrapper
    container_name: scrapper
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/my_db
      SPRING_DATASOURCE_USERNAME: my_user
      SPRING_DATASOURCE_PASSWORD: my_password
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8080"
    networks:
      - app-network

  bot:
    build: ./bot
    container_name: bot
    depends_on:
      - scrapper
    environment:
      SCRAPPER_BASE_URL: http://scrapper:8080
      TELEGRAM_TOKEN: your-bot-token-here
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8080"
    networks:
      - app-network

volumes:
  pg_data:

networks:
  app-network:
    driver: bridge
